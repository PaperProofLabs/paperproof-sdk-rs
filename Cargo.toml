[package]
name = "paperproof-sdk-rs"
version = "0.1.0"
edition = "2024"
description = "Rust SDK for the PaperProof protocol on Sui"
license = "Apache-2.0"
repository = "https://github.com/PaperProofLabs/paperproof-sdk-rs"
readme = "README.md"
keywords = ["paperproof", "sui", "sdk", "walrus", "move"]
categories = ["api-bindings", "cryptography::cryptocurrencies"]
include = [
    "src/**",
    "tests/**",
    "examples/**",
    "docs/**",
    "deploy/**",
    "sql/**",
    "scripts/**",
    ".github/workflows/ci.yml",
    "Dockerfile",
    ".dockerignore",
    "Cargo.toml",
    "Cargo.lock",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
]

[dependencies]
async-trait = "0.1"
base64 = "0.22"
bcs = "0.1"
hex = "0.4"
http = { version = "1.3", optional = true }
prost-types = { version = "0.14", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sui-rpc = { version = "0.3.1", optional = true }
sui-sdk-types = { version = "0.3.1", features = ["serde", "hash"], optional = true }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"], optional = true }
tracing = { version = "0.1", optional = true }

[features]
default = []
async = ["tokio"]
sui-native = ["dep:http", "dep:prost-types", "dep:sui-rpc", "dep:sui-sdk-types", "tokio"]
tracing = ["dep:tracing"]

[dev-dependencies]
anyhow = "1"
criterion = "0.7"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[[bench]]
name = "indexer"
harness = false
