[package]
name = "paperproof-sdk-rs"
version = "0.3.0"
edition = "2024"
description = "Rust SDK for the PaperProof protocol on Sui"
license = "Apache-2.0"
repository = "https://github.com/PaperProofLabs/paperproof-sdk-rs"
readme = "README.md"
keywords = ["paperproof", "sui", "sdk", "walrus", "move"]
categories = ["api-bindings", "cryptography::cryptocurrencies"]
include = [
    "src/**",
    "examples/*.rs",
    "docs/**",
    "sql/**",
    "scripts/verify-package.ps1",
    "scripts/publish-check.ps1",
    "Cargo.toml",
    "Cargo.lock",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
    "/NOTICE",
]

[dependencies]
async-trait = "0.1"
base64 = "0.22"
bcs = "0.1"
hex = "0.4"
http = { version = "1.3", optional = true }
prost-types = { version = "0.14", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sui-rpc = { version = "0.3.1", optional = true }
sui-sdk-types = { version = "0.3.1", features = ["serde", "hash"], optional = true }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-postgres = { version = "0.7", features = ["with-serde_json-1"], optional = true }
tracing = { version = "0.1", optional = true }

[features]
default = []
async = []
postgres = ["dep:tokio-postgres"]
sqlite = ["dep:rusqlite"]
sui-native = ["async", "dep:http", "dep:prost-types", "dep:sui-rpc", "dep:sui-sdk-types"]
tracing = ["dep:tracing"]

[dev-dependencies]
anyhow = "1"
criterion = "0.7"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[[bench]]
name = "indexer"
harness = false
